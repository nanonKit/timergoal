<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TimerGoal Icon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    font-family: 'Segoe UI', sans-serif;
    color: #888;
  }

  /* ── icon shell ── */
  .icon {
    background: #7C6EFA;
    border-radius: 22%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* ── hourglass via clip-path ── */
  .hourglass {
    width:  55%;
    height: 60%;
    background: white;
    clip-path: polygon(
      8%  0%,   92%  0%,
      58% 50%,
      92% 100%, 8%  100%,
      42% 50%
    );
  }

  /* ── size variants ── */
  .s128 { width: 128px; height: 128px; }
  .s64  { width: 64px;  height: 64px;  }
  .s32  { width: 32px;  height: 32px;  }
  .s16  { width: 16px;  height: 16px;  }

  /* ── layout ── */
  .row {
    display: flex;
    align-items: flex-end;
    gap: 32px;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .label { font-size: 12px; }

  /* ── context previews ── */
  .contexts {
    display: flex;
    gap: 32px;
    align-items: center;
  }

  .desktop-bg {
    background: #1e3a5f;
    border-radius: 8px;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .desktop-label {
    font-size: 11px;
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }

  .taskbar-bg {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .taskbar-label { font-size: 12px; color: #ccc; }

  h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #555; }
</style>
</head>
<body>

  <h3>Sizes</h3>

  <div class="row">
    <div class="card">
      <div class="icon s128"><div class="hourglass"></div></div>
      <div class="label">128 px</div>
    </div>
    <div class="card">
      <div class="icon s64"><div class="hourglass"></div></div>
      <div class="label">64 px</div>
    </div>
    <div class="card">
      <div class="icon s32"><div class="hourglass"></div></div>
      <div class="label">32 px</div>
    </div>
    <div class="card">
      <div class="icon s16"><div class="hourglass"></div></div>
      <div class="label">16 px</div>
    </div>
  </div>

  <h3>Context Preview</h3>

  <div class="contexts">

    <div class="desktop-bg">
      <div class="icon s64"><div class="hourglass"></div></div>
      <div class="desktop-label">TimerGoal</div>
    </div>

    <div class="taskbar-bg">
      <div class="icon s32"><div class="hourglass"></div></div>
      <div class="taskbar-label">TimerGoal</div>
    </div>

  </div>

</body>
</html>
